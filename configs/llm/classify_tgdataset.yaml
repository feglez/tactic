# TGDataset LLM classification.
stage: llm_classify_tgdataset

paths:
  # produced by step 31. To reuse an existing artifact, place it at this path
  consolidated_csv: "${output_root}/llm/consolidated/tgdataset_consolidated_channel_data.csv"
  # produced by step 11, the source of the sampled posts
  messages_csv: "${output_root}/preprocessing/tgdataset_llm_input.csv"
  output_dir: "${output_root}/llm/results/tgdataset"

params:
  evidence_mode: title                 # title (TGDataset) | username (DarkGram/TLiveUGR)
  messages_source: llm_input_csv       # llm_input_csv | shard_dir
  message_column: processed_message
  consolidated_channel_id_as_string: true
  variability_threshold: 1800
  last_chars_budget: 50
  debug_limit: null                    # set an integer to classify only the first N channels
  omit_topics: false                   # true = no-topics ablation (drop the topic section)
  resume: false                        # true = skip channels already in classification_log.jsonl
  budget_pin_log: null                 # path to a prior run's log to reuse its per-channel message budget
  ground_truth:
    source: consolidated               # the TGDataset category is carried in the consolidated table
    source_column: Category
    result_column: tgdataset_category

llm:
  transport: ollama_generate           # ollama_generate (default) | litellm
  model: "ollama/gpt-oss:20b_telegramResearch"
  api_base: "http://localhost:11434"
  api_key_env: null                    # no key for local Ollama
  few_shot_in_messages: false          # the custom Ollama model bakes the exemplars in
  temperature: 0.0
  seed: 42
  num_ctx: 6000
  extra_params:
    num_ctx: 6000
  # ---- Alternative: route through a LiteLLM proxy (not token-identical) ----
  # transport: litellm
  # model: "openai/your-proxy-alias"
  # api_base: "https://your-litellm-proxy.example/v1"
  # api_key_env: "LITELLM_API_KEY"      # env var name (the key is read at runtime)
  # few_shot_in_messages: true          # send exemplars as chat messages
  # extra_params: {}
