# DarkGram channel consolidation: one channel-level row per channel for the LLM stage.
stage: llm_consolidate_darkgram

paths:
  # produced by step 11. To reuse an existing artifact, place it at this path
  messages_csv: "${output_root}/preprocessing/darkgram_llm_input.csv"
  # produced by step 30. To reuse an existing artifact, place it at this path
  assignments_csv: "${output_root}/llm/assignments/darkgram/darkgram_channel_topic_assignments_filtered.csv"
  topics_csv: "${output_root}/llm/assignments/darkgram/darkgram_filtered_extracted_topics.csv"
  category_map: null                     # DarkGram has no ground-truth category map
  output_csv: "${output_root}/llm/consolidated/darkgram_consolidated_channel_data.csv"

params:
  metadata_source: llm_input_csv
  metadata_columns: ["Username"]
  keep_only_assigned: false
