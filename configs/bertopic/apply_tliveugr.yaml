# Apply (transform) the frozen final model to the TLiveUGR dataset.
# Writes topics.pkl to ${output_root}/bertopic_output/inference/tliveugr/.
stage: bertopic_apply_tliveugr
paths:
  # produced by step 10. To reuse an existing artifact, place it at this path
  dataset_dir: "${output_root}/preprocessing/tliveugr/final"
  model_dir: "${models_root}/bertopic_final_65ea4f"
  doc_embeddings: "${output_root}/bertopic_output/tliveugr_document_embeddings.pkl"
  output_dir: "${output_root}/bertopic_output/inference/tliveugr"
params:
  input_mode: csv_folder
  embedding_model: all-MiniLM-L6-v2
