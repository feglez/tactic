# BERTopic tuning phase 1: coarse UMAP/HDBSCAN grid on the tuning sample.
stage: bertopic_phase1
paths:
  # produced by step 04. To reuse an existing artifact, place it at this path
  dataset_csv: "${output_root}/preprocessing/translation/tuning_dataset.csv"
  output_dir: "${output_root}/bertopic_output"
  run_log: "${output_root}/bertopic_output/results_log_stage1.csv"
  doc_embeddings: "${output_root}/bertopic_output/tuning_document_embeddings.pkl"
params:
  # null = built-in min_cluster_size sweep (ten fixed values, three
  # document-ratio-derived values and 1000). An explicit list restricts it.
  min_cluster_sizes: null
  phase: phase1
  n_jobs: 4
  parallel: true
  model_name_pattern: "bertopic_{uid}"
  embeddings_mode: compute_if_missing
  embedding_model: all-MiniLM-L6-v2
  target_topics: 45
  progress_desc: "Stage 1 Runs"
