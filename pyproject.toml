[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tactic"
version = "1.0.0"
description = "TACTIC: Topic-guided AI for Cybercriminal Telegram Identification and Classification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
# Versions pinned for deterministic reproduction of the released pipeline.
dependencies = [
    "pandas==2.3.3",
    "numpy==1.26.4",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "umap-learn==0.5.12",
    "hdbscan==0.8.44",
    "numba==0.66.0",
    "sentence-transformers==5.6.0",
    "bertopic==0.17.4",
    "torch==2.12.1",
    "transformers==5.13.0",
    "gensim==4.4.0",
    "joblib==1.5.3",
    "regex==2026.6.28",
    "emoji==2.15.0",
    "sentencepiece==0.2.1",
    "fasttext-wheel==0.9.2",   # provides `import fasttext` (the plain `fasttext` sdist often fails to build)
    "ijson>=3.2",
    "filelock>=3.9",
    "tqdm>=4.64",
    "pyyaml>=6.0",
    "litellm>=1.40",           # optional proxy transport (llm.transport: litellm)
    "requests>=2.31",          # default Ollama /api/generate transport
    "matplotlib>=3.7",         # result charts stage
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Prompt and few-shot assets loaded at runtime by tactic.llm.prompts.
"tactic.llm" = ["prompt_assets/*"]
